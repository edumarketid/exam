<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamSMKN1Wakatobi - CBT System</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800 select-none">

  <div id="app" class="min-h-screen flex flex-col">
    <!-- HEADER -->
    <header class="bg-blue-700 text-white shadow-md">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-white text-blue-700 font-bold flex items-center justify-center rounded-lg shadow">CBT</div>
          <div>
            <h1 class="font-bold text-lg leading-tight">ExamSMKN1Wakatobi</h1>
            <p class="text-xs text-blue-200">Penilaian Sumatif Semester Ganjil TA 2026/2027</p>
          </div>
        </div>
        <div class="flex items-center space-x-3">
          <span id="db-status-badge" class="px-2.5 py-1 text-xs rounded-full bg-yellow-500 text-white font-medium">Memuat DB...</span>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4">
      
      <!-- DASHBOARD ADMIN -->
      <section id="screen-admin" class="space-y-6">
        <div class="flex flex-wrap justify-between items-center bg-white p-4 rounded-lg shadow border gap-3">
          <h2 class="text-lg font-bold text-gray-800">Dashboard Pengelolaan Ujian</h2>
          <div class="flex flex-wrap gap-2">
            <button onclick="app.switchAdminTab('mapel')" class="px-3 py-1.5 text-xs rounded bg-amber-600 text-white font-medium">Data Mapel</button>
            <button onclick="app.switchAdminTab('upload-soal')" class="px-3 py-1.5 text-xs rounded bg-blue-600 text-white font-medium">Upload Soal HTML</button>
          </div>
        </div>

        <!-- TAB: DATA MATA PELAJARAN SUPABASE -->
        <div id="tab-mapel" class="bg-white p-6 rounded-lg shadow border space-y-6">
          <div class="border-b pb-4">
            <h3 class="font-bold text-md text-gray-800">Kelola Data Mata Pelajaran (Supabase Modular)</h3>
            <p class="text-xs text-gray-500 mt-1">Tambah atau hapus daftar Mata Pelajaran terintegrasi Supabase.</p>
          </div>

          <form onsubmit="MapelModule.handleAdd(event)" class="flex gap-3 max-w-lg">
            <input type="text" id="input-nama-mapel-baru" required placeholder="Masukkan Nama Mapel Baru..." class="flex-grow border px-3 py-2 rounded text-xs font-medium focus:ring-2 focus:ring-amber-500">
            <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-4 py-2 rounded shadow transition">+ Tambah Mapel</button>
          </form>

          <div class="space-y-2">
            <h4 class="font-bold text-xs text-gray-700 uppercase">Daftar Mata Pelajaran Aktif:</h4>
            <div id="mapel-list-container" class="space-y-2 max-w-lg"></div>
          </div>
        </div>

        <!-- TAB: UPLOAD SOAL -->
        <div id="tab-upload-soal" class="hidden bg-white p-6 rounded-lg shadow border space-y-4">
          <h3 class="font-bold text-md text-gray-800">Upload Soal HTML</h3>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Pilih Mata Pelajaran</label>
            <select id="select-upload-mapel" class="w-full border px-3 py-2 rounded text-xs bg-gray-50 font-medium max-w-lg"></select>
          </div>
        </div>

      </section>
    </main>
  </div>

  <!-- LOAD MODULES IN CORRECT ORDER -->
  <script src="./config.js"></script>
  <script src="./js/supabase.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/mapel.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
